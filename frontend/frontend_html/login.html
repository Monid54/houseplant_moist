<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>Login - PlantCare</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- GOOGLE FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- MAIN CSS -->
  <link
    rel="stylesheet"
    href="../frontend_css/login.css"
  />

</head>

<body>

  <div class="auth-page">

    <!-- RIGHT PANEL -->
    <div class="auth-right">

      <a
        href="https://www.plantcare.com"
        target="_blank"
      >

        <img
          src="../images/plantcare.png"
          alt="PlantCare Logo"
          class="logo"
        />

      </a>

      <h3>
        Login to your PlantCare account
      </h3>

      <p>
        Stay connected to your plants,
        track watering schedules,
        monitor plant health,
        and receive smart reminders
        tailored to each plant’s needs.
      </p>

      <h4>
        Sign in to your PlantCare dashboard
      </h4>

      <img
        src="../images/plant1.PNG"
        alt="Plant Illustration"
        class="illustration"
      />

    </div>

    <!-- LEFT PANEL -->
    <div class="auth-left">

      <form
        id="loginForm"
        class="auth-form"
      >

        <h2>
          Login to your account
        </h2>

        <!-- SECURED LOGIN -->
        <div class="secured-login">

          <img
            src="https://img.icons8.com/?size=100&id=kzLfqGwKtL8z&format=png&color=078311"
            alt="Lock Icon"
          />

          <span>
            Secured Login
          </span>

        </div>

        <!-- EMAIL -->
        <div class="input-group">

          <input
            type="email"
            name="email"
            placeholder="Email"
            required
          />

        </div>

        <!-- PASSWORD -->
        <div class="input-group password-group">

          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />

          <span
            class="toggle-password"
            onclick="togglePassword(this)"
          >

            <img
              src="https://img.icons8.com/?size=100&id=34226&format=png&color=737373"
              alt="Toggle Password"
            />

          </span>

        </div>

        <!-- OPTIONS -->
        <div class="form-options">

          <label class="remember-left">

            <input
              type="checkbox"
              name="remember"
            />

            <span>
              Remember me
            </span>

          </label>

          <a
            href="#"
            class="forgot-link"
          >
            Forgot Password?
          </a>

        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit">

          Log In

        </button>

        <!-- FOOTER -->
        <p class="footer-text">

          Don’t have an account?

          <a
            href="signup.html"
            class="signup-link"
          >
            Sign Up
          </a>

        </p>

      </form>

    </div>

  </div>

  <!-- LOGIN JS -->
  <script
    src="../frontend_js/login.js">
  </script>

</body>
</html>
