<head>

  <title>Sign Up - PlantCare</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Intl Tel Input CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.min.css"
  />

  <!-- Main CSS -->
  <link

    href="../frontend_css/signup.css"

</head>

<body>

  <div class="signup-page">

    <!-- RIGHT SECTION -->
    <div class="signup-right">

      <a href="https://www.plantcare.com" target="_blank">
        <img
          src="../images/plantcare.png"
          alt="PlantCare Logo"
          class="logo"
        />
      </a>

      <h4>All your plants in one place</h4>

      <p>
        With PlantCare, you stay connected to your plants,
        track watering schedules, monitor plant health,
        and receive smart reminders tailored to each
        plant’s needs.
      </p>

      <h4>
        Sign up to customize your experience
      </h4>

      <img
        src="../images/2phones.png"
        alt="PlantCare Illustration"
        class="illustration"
      />

    </div>

    <!-- LEFT SECTION -->
    <div class="signup-left">

      <form
        id="signupForm"
        class="signup-form"
      >

        <h2>Register</h2>

        <input
          type="hidden"
          name="ref"
          value="<%= ref || '' %>"
        />

        <!-- FIRST NAME -->
        <div class="form-group">
          <input
            type="text"
            name="firstname"
            placeholder="First Name"
            required
          />
        </div>

        <!-- LAST NAME -->
        <div class="form-group">
          <input
            type="text"
            name="lastname"
            placeholder="Last Name"
            required
          />
        </div>

        <!-- GENDER -->
        <div class="form-group">
          <select name="gender" required>

            <option value="">
              Select Gender
            </option>

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>

            <option value="Other">
                Other
            </option>

          </select>
        </div>

        <!-- COUNTRY -->

            name="country"
            required
